# GSERP — production override (shared Postgres kullanır)
# Çalıştırma: docker compose -f docker-compose.prod.yml up -d --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gserp:latest
    container_name: gserp-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DB_HOST:-postgres}:5432/${DB_NAME:-gserp_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-gserp_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env'de tanımlı olmalı}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env'de tanımlı olmalı}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      GSERP_INITIAL_ADMIN_USERNAME: ${GSERP_INITIAL_ADMIN_USERNAME:-}
      GSERP_INITIAL_ADMIN_PASSWORD: ${GSERP_INITIAL_ADMIN_PASSWORD:-}
      SERVER_PORT: 8989
      LOG_DIR: /var/log/gserp
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - gserp-app-logs:/var/log/gserp
    networks:
      - shared-db

volumes:
  gserp-app-logs:

networks:
  shared-db:
    external: true
