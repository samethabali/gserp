name: Staging CI

on:
  push:
    branches: [staging]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Flyway validate + tests
        run: mvn -B verify
      - name: Migration gate reminder
        run: echo "Staging deploy — prod öncesi Flyway V14+ migration snapshot test edilmeli"
