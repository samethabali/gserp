# GSCRM — production-ready push'unda VPS'e otomatik deploy.
#
# Akış: SSH ile VPS'e bağlan, mevcut kurulum dizininde git pull yap, docker compose
# build + up çalıştır, app healthy olana kadar bekle.
#
# Gerekli GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   VDS_HOST         VPS IP veya hostname (örn. 203.0.113.10)
#   VDS_USER         SSH kullanıcısı (=gserp) — docker grubunda olmalı
#   VDS_SSH_KEY      Bu kullanıcının PRIVATE SSH anahtarı (tüm içerik)
#   VDS_SSH_PORT     (opsiyonel) SSH portu — tanımsızsa 22
#
# Not: VPS dizini /home/gserp/gserp. Bu workflow ilk kurulumu YAPMAZ; mevcut stack'i
# günceller. Kurulum dizini yalnızca gserp kullanıcısına açık olduğu için sunucunun
# durumunu görmenin tek yolu bu workflow'dur: elle tetiklerken "sadece_teshis" ile
# hiçbir değişiklik yapmadan durum raporu alınabilir.

name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production-ready]
  workflow_dispatch:
    inputs:
      sadece_teshis:
        description: "Sadece teşhis: durumu raporla, deploy yapma"
        type: boolean
        default: false
      geri_al:
        description: "GERİ AL: bir önceki imaja dön (build yok, ~100 sn)"
        type: boolean
        default: false

concurrency:
  group: vps-deploy
  cancel-in-progress: false   # Deploy'ları yarıda kesme; sırayla çalışsınlar

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile VPS'e deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          DIAG_ONLY: ${{ inputs.sadece_teshis && '1' || '0' }}
          ROLLBACK: ${{ inputs.geri_al && '1' || '0' }}
          REPO_URL: https://github.com/${{ github.repository }}.git
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_SSH_PORT || 22 }}
          command_timeout: 25m
          envs: DIAG_ONLY,ROLLBACK,REPO_URL
          script: |
            set -euo pipefail

            INSTALL_DIR=/home/gserp/gserp
            BRANCH=production-ready
            # App, paylaşımlı (external) postgres kullanan prod override ile çalışır.
            # Bu dosya ARTIK REPODA takip ediliyor (2026-09-05); önceden yalnızca
            # VPS'te elle bakılıyordu ve gözden geçirilemiyordu. Sunucudaki takipsiz
            # kopya kenara alındıktan sonra git'ten geliyor — bkz. docs/ssh-gorev-2.md
            COMPOSE_FILE="$INSTALL_DIR/docker-compose.prod.yml"

            # git'in kimlik sorması, etkileşimsiz oturumda "could not read Username"
            # hatasıyla deploy'u kilitliyordu. Sorma, hemen hata ver.
            export GIT_TERMINAL_PROMPT=0
            export GIT_ASKPASS=/bin/true

            cd "$INSTALL_DIR"

            echo "===== TESHIS ====="
            echo "[i] dizin   : $INSTALL_DIR"
            echo "[i] HEAD    : $(git rev-parse --short HEAD 2>&1 || echo '?')"
            echo "[i] branch  : $(git rev-parse --abbrev-ref HEAD 2>&1 || echo '?')"
            echo "[i] remote  : $(git remote get-url origin 2>&1 || echo 'yok')"
            echo "[i] compose : $([ -f "$COMPOSE_FILE" ] && echo VAR || echo 'YOK -> deploy yapilamaz')"
            echo "[i] .env    : $([ -f "$INSTALL_DIR/.env" ] && echo VAR || echo YOK)"
            if [ -f "$INSTALL_DIR/.env" ]; then
              # Degerleri ASLA yazdirma; sadece hangi anahtarlarin tanimli oldugunu goster.
              echo "[i] .env anahtarlari: $(grep -oE '^[A-Z0-9_]+' "$INSTALL_DIR/.env" | sort | tr '\n' ' ')"
            fi
            echo "[i] calisan container:"
            docker ps --filter name=gserp --format '    {{.Names}}  {{.Status}}  {{.Ports}}' || true
            echo "[i] gserp imajlari:"
            docker images --format '    {{.Repository}}:{{.Tag}}  {{.Size}}' | grep -iE 'gserp|gscrm' || echo "    yok"
            echo "[i] disk    : $(df -h "$INSTALL_DIR" | awk 'NR==2{print $4" bos / "$2" ("$5" dolu)"}')"
            echo "[i] kirli dosyalar:"
            git status --porcelain | head -20 || true
            echo "=================="

            if [ "${DIAG_ONLY:-0}" = "1" ]; then
              echo "[=] sadece_teshis modu — hicbir degisiklik yapilmadi."
              exit 0
            fi

            # --- Elle geri alma -------------------------------------------------
            # Bozuk bir deploy'dan donmenin tek yolu, kodu geri alip yeniden build
            # etmekti: bir build suresi daha kesinti demek. Burada onceki imaj
            # dogrudan geri konur, build yok — olculen ~100 sn.
            # Git'e dokunulmaz: repo ileride kalir, yalnizca calisan imaj geri alinir.
            if [ "${ROLLBACK:-0}" = "1" ]; then
              echo "===== GERI ALMA ====="
              if [ ! -f "$COMPOSE_FILE" ]; then
                echo "[x] $COMPOSE_FILE yok — geri alinamaz."
                exit 1
              fi
              if ! docker image inspect gserp:previous >/dev/null 2>&1; then
                echo "[x] gserp:previous yok. Geri donulecek bir imaj kaydedilmemis"
                echo "    (bu ozellik eklendikten sonra henuz deploy yapilmamis olabilir)."
                exit 1
              fi
              EXTRA_ENV_FILE="$INSTALL_DIR/docker-compose.deploy-env.yml"
              COMPOSE="-f $COMPOSE_FILE"
              [ -f "$EXTRA_ENV_FILE" ] && COMPOSE="$COMPOSE -f $EXTRA_ENV_FILE"

              echo "[*] gserp:previous -> gserp:latest"
              docker tag gserp:previous gserp:latest
              docker compose $COMPOSE up -d

              DEADLINE=$(( $(date +%s) + 180 ))
              OK=0
              while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                if curl -fsS --max-time 5 "http://127.0.0.1:8989/actuator/health" >/dev/null 2>&1; then
                  OK=1; break
                fi
                sleep 5
              done
              if [ "$OK" = "1" ]; then
                echo "[+] Geri alma tamam — onceki surum ayakta."
                exit 0
              fi
              echo "[x] Geri alinan surum de saglikli olmadi. Loglar:"
              docker compose $COMPOSE logs --tail 120 app
              exit 1
            fi

            # Repo public; remote'u her deployda dogru URL'e sabitle ki kimlik
            # dogrulama isteyen eski/yanlis bir URL deploy'u bir daha kilitlemesin.
            CUR_URL=$(git remote get-url origin 2>/dev/null || echo "")
            if [ "$CUR_URL" != "$REPO_URL" ]; then
              echo "[!] remote duzeltiliyor: '$CUR_URL' -> '$REPO_URL'"
              git remote set-url origin "$REPO_URL"
            fi

            echo "[*] fetch + checkout $BRANCH"
            git fetch origin --tags --prune
            git checkout "$BRANCH"
            if ! git merge --ff-only "origin/$BRANCH"; then
              echo "[x] ff-only guncelleme basarisiz — sunucudaki kopya ayrismis."
              echo "    Yerel commitler:"
              git log --oneline "origin/$BRANCH..HEAD" | head -20
              exit 1
            fi
            echo "[+] Guncel: $(git rev-parse --short HEAD)"

            if [ ! -f "$COMPOSE_FILE" ]; then
              echo "[x] $COMPOSE_FILE yok — bu workflow ilk kurulumu yapmaz."
              exit 1
            fi

            # --- Zorunlu env guvencesi ----------------------------------------
            ENV_FILE="$INSTALL_DIR/.env"
            if [ ! -f "$ENV_FILE" ]; then
              echo "[x] $ENV_FILE yok — deploy yapilamaz."
              exit 1
            fi
            ENV_BACKED_UP=0
            backup_env_once() {
              if [ "$ENV_BACKED_UP" = "0" ]; then
                cp -a "$ENV_FILE" "$ENV_FILE.bak.$(date +%Y%m%d%H%M%S)"
                ENV_BACKED_UP=1
              fi
            }
            # Tanimli degilse ekle; tanimliysa asla dokunma (sunucu kaynak dogrudur).
            ensure_env() {
              key="$1"; value="$2"; secret="${3:-0}"
              if grep -qE "^$key=.+" "$ENV_FILE"; then
                echo "[i] $key zaten tanimli."
                return
              fi
              backup_env_once
              grep -v "^$key=" "$ENV_FILE" > "$ENV_FILE.tmp"
              printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE.tmp"
              mv "$ENV_FILE.tmp" "$ENV_FILE"
              chmod 600 "$ENV_FILE"
              if [ "$secret" = "1" ]; then
                echo "[+] $key uretildi ve .env'e eklendi (deger loglanmadi)."
              else
                echo "[+] $key .env'e eklendi: $value"
              fi
            }
            # Public değerler kaynak kodundaki kanonik ayarla aynı tutulur.
            set_public_env() {
              key="$1"; value="$2"
              if grep -qxF "$key=$value" "$ENV_FILE"; then
                echo "[i] $key zaten güncel."
                return
              fi
              backup_env_once
              grep -v "^$key=" "$ENV_FILE" > "$ENV_FILE.tmp"
              printf '%s=%s\n' "$key" "$value" >> "$ENV_FILE.tmp"
              mv "$ENV_FILE.tmp" "$ENV_FILE"
              chmod 600 "$ENV_FILE"
              echo "[+] $key güncellendi: $value"
            }

            # Prod guard bu anahtari zorunlu kilar; yoksa app acilista dusuyor.
            # Anahtari sunucuda uretiyoruz: GitHub'a hic girmiyor.
            ensure_env APP_ENCRYPTION_KEY "$(openssl rand -base64 48 | tr -d '\n')" 1

            # Tek domain, yol tabanli kiraci: alt alan adi cozumlemesi kaldirildi.
            # Bu deger artik kiraci cozmez, yalnizca paylasilabilir link uretir
            # (davet linki, isletmenin randevu linki).
            set_public_env APP_PUBLIC_BASE_URL "https://gscrm.avesitesi.xyz"

            # Platform admin hic seed edilmiyordu; davet kodu paneline girilemiyordu.
            # Parola sunucuda uretilir, ilk giriste degistirilmesi zorunlu.
            ensure_env GSCRM_PLATFORM_ADMIN_USERNAME "platform" 0
            ensure_env GSCRM_PLATFORM_ADMIN_PASSWORD "$(openssl rand -base64 24 | tr -d '\n')" 1

            # docker-compose.prod.yml elle bakiliyor ve env'i secili bir liste ile
            # gecirtiyor; ona dokunmamak icin ek env gecisleri ayri bir compose
            # dosyasinda tutulup -f ile birlestiriliyor.
            EXTRA_ENV_FILE="$INSTALL_DIR/docker-compose.deploy-env.yml"
            rm -f "$INSTALL_DIR/docker-compose.secrets.yml"   # eski ad
            {
              printf '%s\n' "# Deploy workflow tarafindan uretildi — elle duzenlemeyin."
              printf '%s\n' "# docker-compose.prod.yml ile birlikte -f ile yuklenir."
              printf '%s\n' "services:"
              printf '%s\n' "  app:"
              printf '%s\n' "    environment:"
              printf '%s\n' '      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}'
              printf '%s\n' '      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL}'
              printf '%s\n' '      GSCRM_PLATFORM_ADMIN_USERNAME: ${GSCRM_PLATFORM_ADMIN_USERNAME}'
              printf '%s\n' '      GSCRM_PLATFORM_ADMIN_PASSWORD: ${GSCRM_PLATFORM_ADMIN_PASSWORD}'
            } > "$EXTRA_ENV_FILE"
            COMPOSE="-f $COMPOSE_FILE -f $EXTRA_ENV_FILE"

            # Build oncesi yer ac (yalnizca dangling imajlar).
            docker image prune -f >/dev/null 2>&1 || true
            echo "[i] build oncesi disk: $(df -h "$INSTALL_DIR" | awk 'NR==2{print $4" bos"}')"

            # Calisan imaji "onceki" olarak etiketle — geri donus noktasi.
            # Etiketlenmis imaj dangling olmadigi icin asagidaki image prune onu silmez.
            # Konteynerin gercekte kullandigi imaj kimligi alinir; gserp:latest bu
            # sirada zaten yeni build'e isaret ediyor olabilir.
            RUNNING_CID=$(docker compose $COMPOSE ps -q app 2>/dev/null || echo "")
            if [ -n "$RUNNING_CID" ]; then
              RUNNING_IMG=$(docker inspect --format='{{.Image}}' "$RUNNING_CID" 2>/dev/null || echo "")
              if [ -n "$RUNNING_IMG" ]; then
                docker tag "$RUNNING_IMG" gserp:previous && \
                  echo "[i] geri donus noktasi: gserp:previous -> ${RUNNING_IMG#sha256:}" | cut -c1-72
              fi
            else
              echo "[i] calisan konteyner yok; geri donus noktasi olusturulmadi."
            fi

            echo "[*] docker compose build + up ($COMPOSE_FILE)"
            docker compose $COMPOSE build app
            docker compose $COMPOSE up -d

            # Konteyner adi compose dosyasindan cozulur; marka/ad degisimlerinde kirilmaz.
            APP_CID=$(docker compose $COMPOSE ps -q app)
            if [ -z "$APP_CID" ]; then
              echo "[x] app servisi bulunamadi ($COMPOSE_FILE)"
              docker compose $COMPOSE ps
              exit 1
            fi

            # Compose'da healthcheck tanimli degilse .State.Health bos kaliyor ve
            # bekleme dongusu bosuna doluyordu; o durumda HTTP ucundan dogrula.
            HAS_HEALTH=$(docker inspect --format='{{if .State.Health}}yes{{else}}no{{end}}' "$APP_CID")
            APP_PORT=$(docker inspect --format='{{range $p, $c := .NetworkSettings.Ports}}{{range $c}}{{.HostPort}} {{end}}{{end}}' "$APP_CID" | awk '{print $1}')
            APP_PORT=${APP_PORT:-8989}
            echo "[*] App ayaga kalkmasi bekleniyor (max 240s) — cid=${APP_CID:0:12}, health=$HAS_HEALTH, port=$APP_PORT"

            DEADLINE=$(( $(date +%s) + 240 ))
            OK=0
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              RUNNING=$(docker inspect --format='{{.State.Status}}' "$APP_CID" 2>/dev/null || echo missing)
              if [ "$RUNNING" = "running" ]; then
                if [ "$HAS_HEALTH" = "yes" ]; then
                  if [ "$(docker inspect --format='{{.State.Health.Status}}' "$APP_CID")" = "healthy" ]; then OK=1; break; fi
                else
                  if curl -fsS --max-time 5 "http://127.0.0.1:${APP_PORT}/actuator/health" >/dev/null 2>&1; then OK=1; break; fi
                fi
              elif [ "$RUNNING" = "exited" ]; then
                echo "[x] container cikti (exited). Loglar:"
                docker compose $COMPOSE logs --tail 120 app
                exit 1
              fi
              sleep 5
            done

            if [ "$OK" != "1" ]; then
              echo "[x] app saglikli olmadi. Son loglar:"
              docker compose $COMPOSE logs --tail 120 app

              # Eskiden burada exit 1 vardi ve uygulama KAPALI kaliyordu: basarisiz
              # bir deploy, duzeltilene kadar suren bir kesintiye donusuyordu.
              # Once bilinen calisan imaja donulur, sonra hata bildirilir.
              if docker image inspect gserp:previous >/dev/null 2>&1; then
                echo "[!] GERI ALINIYOR: gserp:previous -> gserp:latest"
                docker tag gserp:previous gserp:latest
                docker compose $COMPOSE up -d
                RB_DEADLINE=$(( $(date +%s) + 180 ))
                RB_OK=0
                while [ "$(date +%s)" -lt "$RB_DEADLINE" ]; do
                  if curl -fsS --max-time 5 "http://127.0.0.1:${APP_PORT}/actuator/health" >/dev/null 2>&1; then
                    RB_OK=1; break
                  fi
                  sleep 5
                done
                if [ "$RB_OK" = "1" ]; then
                  echo "[+] Geri alindi — onceki surum ayakta. Deploy BASARISIZ."
                else
                  echo "[x] Geri alma da basarisiz — uygulama KAPALI, elle mudahale gerekli."
                fi
              else
                echo "[x] gserp:previous yok, geri alinamiyor — uygulama KAPALI."
              fi
              exit 1
            fi
            echo "[+] app saglikli"

            # Eski/dangling imajlari temizle (disk sismesin)
            docker image prune -f >/dev/null 2>&1 || true

            echo "[+] Deploy tamam: $(git rev-parse --short HEAD)"
