# GSCRM — production-ready push'unda VPS'e otomatik deploy.
#
# Akış: SSH ile VPS'e bağlan, mevcut kurulum dizininde git pull yap, docker compose
# build + up çalıştır, app healthy olana kadar bekle.
#
# Gerekli GitHub repo secrets (Settings -> Secrets and variables -> Actions):
#   VDS_HOST         VPS IP veya hostname (örn. 203.0.113.10)
#   VDS_USER         SSH kullanıcısı (=gserp) — docker grubunda olmalı
#   VDS_SSH_KEY      Bu kullanıcının PRIVATE SSH anahtarı (tüm içerik)
#   VDS_SSH_PORT     (opsiyonel) SSH portu — tanımsızsa 22
#
# Not: VPS dizini henüz /home/gserp/gserp olabilir; domain/dizin kesimi ayrı onay.
# Bu workflow ilk kurulumu YAPMAZ; sadece mevcut stack'i günceller.

name: Deploy to VPS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production-ready]
  workflow_dispatch: {}

concurrency:
  group: vps-deploy
  cancel-in-progress: false   # Deploy'ları yarıda kesme; sırayla çalışsınlar

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile VPS'e deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VDS_HOST }}
          username: ${{ secrets.VDS_USER }}
          key: ${{ secrets.VDS_SSH_KEY }}
          port: ${{ secrets.VDS_SSH_PORT || 22 }}
          command_timeout: 15m
          script: |
            set -euo pipefail

            INSTALL_DIR=/home/gserp/gserp
            BRANCH=production-ready
            # App, paylaşımlı (external) postgres kullanan prod override ile çalışır.
            # Bu dosya VPS'e özgüdür (repo'da takip edilmez), silme.
            COMPOSE_FILE="$INSTALL_DIR/docker-compose.prod.yml"

            cd "$INSTALL_DIR"

            echo "[*] Mevcut: $(git rev-parse --short HEAD)"
            git fetch --all --tags --prune
            git checkout "$BRANCH"
            git pull --ff-only
            echo "[+] Güncel: $(git rev-parse --short HEAD)"

            echo "[*] docker compose build + up ($COMPOSE_FILE)"
            docker compose -f "$COMPOSE_FILE" build app
            docker compose -f "$COMPOSE_FILE" up -d

            echo "[*] App healthy bekleniyor (max 120s)..."
            DEADLINE=$(( $(date +%s) + 120 ))
            STATUS=missing
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' gserp-app 2>/dev/null || echo missing)
              if [ "$STATUS" = "healthy" ]; then
                echo "[+] gserp-app healthy"
                break
              fi
              sleep 5
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "[x] gserp-app healthy olmadı (durum: $STATUS). Son loglar:"
              docker compose -f "$COMPOSE_FILE" logs --tail 80 app
              exit 1
            fi

            # Eski/dangling imajları temizle (disk şişmesin)
            docker image prune -f >/dev/null 2>&1 || true

            echo "[+] Deploy tamam: $(git rev-parse --short HEAD)"
