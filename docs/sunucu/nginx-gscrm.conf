# Kaynak: üretim sunucusu (avesitesi), /etc/nginx/sites-available/gscrm
# Alınma tarihi: 2026-09-05 — salt okuma kopyası, sunucuda değiştirilmedi.
# sites-enabled/gscrm -> sites-available/gscrm sembolik bağı ile etkin (4 Eyl 13:43).
# TLS Cloudflare Origin sertifikası ile; 80 portunu dinleyen blok YOK
# (HTTP->HTTPS yönlendirmesi Cloudflare tarafında yapılıyor).

server {
    listen 443 ssl http2;
    server_name gscrm.avesitesi.xyz;

    ssl_certificate     /etc/ssl/cloudflare/origin-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8989;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws-calendar/ {
        proxy_pass http://127.0.0.1:8989;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }
}

# ---------------------------------------------------------------------------
# Kaynak: /etc/nginx/sites-available/gserp  (eski alan adı, kalıcı yönlendirme)
# ---------------------------------------------------------------------------

server {
    listen 443 ssl http2;
    server_name gserp.avesitesi.xyz;

    ssl_certificate     /etc/ssl/cloudflare/origin-cert.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;

    return 301 https://gscrm.avesitesi.xyz$request_uri;
}
