<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>GSERP — Salon Ayarları</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">💅</div>
            <div><h1>GSERP</h1><span class="brand-sub">Salon Yönetim Sistemi</span></div>
        </div>
        <nav th:replace="~{fragments/sidebar-nav :: nav('settings')}"></nav>
    </aside>
    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" id="menuToggle" aria-label="Menüyü Aç">☰</button>
                <span class="topbar-title">⚙️ Salon Ayarları</span>
            </div>
            <div class="topbar-actions">
                <span style="color:var(--color-text-muted);font-size:0.9rem;">👤 <span sec:authentication="name">user</span></span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary btn-xs">Çıkış</button>
                </form>
            </div>
        </header>
        <div class="page-content">
            <div class="glass-card" style="padding:24px;max-width:560px;">
                <h2 style="margin-bottom:20px;">White-label Görünüm</h2>
                <p style="color:var(--text-muted);font-size:0.85rem;margin-bottom:20px;">
                    Bu ayarlar booking sayfası ve müşteri portalında görünür.
                </p>
                <div class="form-group">
                    <label class="form-label">Salon Adı</label>
                    <input type="text" class="form-input" id="salonName" placeholder="Örn. Güzellik Merkezi">
                </div>
                <div class="form-group">
                    <label class="form-label">Logo URL (opsiyonel)</label>
                    <input type="url" class="form-input" id="logoUrl" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label class="form-label">Ana Renk (hex)</label>
                    <input type="text" class="form-input" id="primaryColor" placeholder="#e91e8c">
                </div>
                <button class="btn btn-primary" onclick="saveSettings()">💾 Kaydet</button>
            </div>
        </div>
    </main>
</div>
<script src="/js/app.js"></script>
<script>
async function loadSettings() {
    const json = await api('GET', '/api/settings');
    const s = json.data || {};
    document.getElementById('salonName').value = s.name || '';
    document.getElementById('logoUrl').value = s.logoUrl || '';
    document.getElementById('primaryColor').value = s.primaryColor || '#e91e8c';
}
async function saveSettings() {
    const body = {
        name: document.getElementById('salonName').value.trim(),
        logoUrl: document.getElementById('logoUrl').value.trim(),
        primaryColor: document.getElementById('primaryColor').value.trim()
    };
    const json = await api('PUT', '/api/settings', body);
    showToast(json.message || 'Kaydedildi', json.success ? 'success' : 'error');
}
document.addEventListener('DOMContentLoaded', loadSettings);
</script>
</body>
</html>
