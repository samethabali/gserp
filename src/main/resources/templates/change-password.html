<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>Parola Değiştir — GSCRM</title>
    <link th:replace="~{fragments/assets :: styles}"/>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <form class="glass-card" style="width:100%;max-width:420px;padding:32px;" onsubmit="event.preventDefault(); submitChange();">
        <h1 style="margin-bottom:8px;">Parola Değiştir</h1>
        <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:20px;">İlk girişte veya güvenlik nedeniyle yeni bir parola belirlemeniz gerekiyor.</p>
        <!-- Sunucunun 400 gerekçesi ("Mevcut parola hatalı" gibi) burada görünür.
             showToast bu sayfada sessizce düşüyordu: toastContainer yok. -->
        <div id="changeError" role="alert" hidden
             style="margin-bottom:16px;padding:10px 14px;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:8px;color:#e74c3c;font-size:0.9rem;"></div>
        <div class="form-group">
            <label class="form-label" for="currentPassword">Mevcut Parola</label>
            <!-- İpucu olmadan tarayıcı iki alanı da ayırt edemiyor ve parola yöneticisi
                 "Mevcut Parola"ya kayıtlı eski parolayı dolduruyordu. -->
            <input type="password" class="form-input" id="currentPassword" required
                   autocomplete="current-password">
        </div>
        <div class="form-group">
            <label class="form-label" for="newPassword">Yeni Parola</label>
            <input type="password" class="form-input" id="newPassword" minlength="8" required
                   autocomplete="new-password">
        </div>
        <button type="submit" id="changeSubmit" class="btn btn-primary" style="width:100%;">Kaydet</button>
    </form>
</div>
<script th:replace="~{fragments/assets :: app-js}"></script>
<script th:replace="~{fragments/assets :: custom-select-js}"></script>
<script>
function showChangeError(message) {
    const box = document.getElementById('changeError');
    box.textContent = message;
    box.hidden = false;
}

async function submitChange() {
    const button = document.getElementById('changeSubmit');
    document.getElementById('changeError').hidden = true;
    const body = {
        currentPassword: document.getElementById('currentPassword').value,
        newPassword: document.getElementById('newPassword').value
    };
    button.disabled = true;
    try {
        const res = await api('POST', '/api/auth/change-password', body);
        if (res.success) {
            // Hedefi sunucu söyler: kurulumu bitmemiş kiracı sihirbaza gitmeli.
            window.location.href = (res.data && res.data.nextUrl) || '/';
            return;
        }
        showChangeError(res.message || 'Parola değiştirilemedi');
    } catch (e) {
        showChangeError('Sunucuya ulaşılamadı, lütfen tekrar deneyin');
    } finally {
        button.disabled = false;
    }
}
</script>
</body>
</html>
