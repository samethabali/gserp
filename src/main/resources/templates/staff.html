<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>GSCRM — Personel</title>
    <link th:replace="~{fragments/assets :: styles}"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">💅</div>
            <div><h1>GSCRM</h1><span class="brand-sub">Salon CRM</span></div>
        </div>
        <nav th:replace="~{fragments/sidebar-nav :: nav('staff')}"></nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" id="menuToggle" aria-label="Menüyü Aç">☰</button>
                <span class="topbar-title">👩‍💼 Personel Yönetimi</span>
            </div>
            <div class="topbar-actions">
                <span style="color:var(--color-text-muted);font-size:0.9rem;">👤 <span sec:authentication="name">user</span></span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary btn-xs">Çıkış</button>
                </form>
            </div>
        </header>
        <div class="page-content">
            <!--
              Hesap uçları yalnızca yönetime açık. İşaret olmadan resepsiyonist de
              /api/staff/accounts'a istek atar, 403 alır ve ortak api() yardımcısı
              onu giriş sayfasına atardı.
            -->
            <span id="canManageAccounts" hidden
                  sec:authorize="hasAnyRole('BRANCH_MANAGER','ORG_OWNER','PLATFORM_ADMIN','ADMIN')"></span>
            <div class="crud-header">
                <h2>Personel Listesi</h2>
                <button class="btn btn-primary" onclick="openStaffModal()">➕ Yeni Personel</button>
            </div>
            <div class="kpi-grid" id="staffGrid"></div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="staffModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="staffModalTitle">Yeni Personel</h3>
            <button class="modal-close" onclick="closeModal('staffModal')">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editStaffId">
            <div class="form-group">
                <label class="form-label">Ad Soyad</label>
                <input type="text" class="form-input" id="stfName" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Telefon</label>
                    <input type="text" class="form-input" id="stfPhone">
                </div>
                <div class="form-group">
                    <label class="form-label">E-posta</label>
                    <input type="email" class="form-input" id="stfEmail">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Rol</label>
                    <select class="form-select" id="stfRole">
                        <option value="SPECIALIST">Uzman</option>
                        <option value="RECEPTIONIST">Resepsiyonist</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Renk</label>
                    <input type="color" class="form-input" id="stfColor" value="#9b59b6" style="height:42px;padding:4px;">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Uzmanlık Alanları</label>
                <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;" id="specializationCheckboxes">
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 12px;background:var(--bg-card);border:1px solid var(--border-glass);border-radius:8px;">
                        <input type="checkbox" value="HAIR"> Saç
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 12px;background:var(--bg-card);border:1px solid var(--border-glass);border-radius:8px;">
                        <input type="checkbox" value="NAIL"> Tırnak
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 12px;background:var(--bg-card);border:1px solid var(--border-glass);border-radius:8px;">
                        <input type="checkbox" value="SKIN"> Cilt
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 12px;background:var(--bg-card);border:1px solid var(--border-glass);border-radius:8px;">
                        <input type="checkbox" value="LASER"> Lazer
                    </label>
                    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 12px;background:var(--bg-card);border:1px solid var(--border-glass);border-radius:8px;">
                        <input type="checkbox" value="OTHER"> Diğer
                    </label>
                </div>
            </div>
            <div class="form-group" id="accountOptionGroup">
                <label style="display:flex;align-items:flex-start;gap:8px;cursor:pointer;">
                    <input type="checkbox" id="stfCreateAccount" checked style="margin-top:3px;">
                    <span>
                        <strong>Sisteme giriş hesabı oluştur</strong><br>
                        <span style="font-size:0.8rem;color:var(--text-muted);">
                            Kullanıcı adı ve geçici parola üretilir; personel ilk girişte kendi parolasını belirler.
                        </span>
                    </span>
                </label>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('staffModal')">İptal</button>
            <button class="btn btn-primary" onclick="saveStaff()">💾 Kaydet</button>
        </div>
    </div>
</div>

<!-- Geçici Giriş Bilgileri -->
<div class="modal-overlay" id="credentialsModal">
    <div class="modal" style="max-width:440px;">
        <div class="modal-header">
            <h3>🔑 Giriş Bilgileri — <span id="credStaffName"></span></h3>
            <button class="modal-close" onclick="closeModal('credentialsModal')">✕</button>
        </div>
        <div class="modal-body">
            <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:16px;">
                Bu parola yalnızca şimdi görüntülenir, daha sonra tekrar gösterilemez.
                Personele iletin; ilk girişinde kendi parolasını belirlemesi istenecek.
            </p>
            <div class="form-group">
                <label class="form-label">Kullanıcı Adı</label>
                <input type="text" class="form-input" id="credUsername" readonly onclick="this.select()">
            </div>
            <div class="form-group">
                <label class="form-label">Geçici Parola</label>
                <input type="text" class="form-input" id="credPassword" readonly
                       onclick="this.select()" style="font-family:monospace;letter-spacing:1px;">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="copyCredentials()">📋 Kopyala</button>
            <button class="btn btn-primary" onclick="closeModal('credentialsModal')">Anladım</button>
        </div>
    </div>
</div>

<!-- Çalışma Saatleri Modalı -->
<div class="modal-overlay" id="workingHoursModal">
    <div class="modal" style="max-width:520px;">
        <div class="modal-header">
            <h3>⏰ Çalışma Saatleri — <span id="whStaffName"></span></h3>
            <button class="modal-close" onclick="closeModal('workingHoursModal')">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="whStaffId">
            <table style="width:100%;border-collapse:collapse;" id="whTable">
                <thead>
                    <tr style="font-size:0.72rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;">
                        <th style="padding:6px 8px;text-align:left;">Gün</th>
                        <th style="padding:6px 8px;text-align:center;">İzin Günü</th>
                        <th style="padding:6px 8px;text-align:left;">Başlangıç</th>
                        <th style="padding:6px 8px;text-align:left;">Bitiş</th>
                    </tr>
                </thead>
                <tbody id="whRows"></tbody>
            </table>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('workingHoursModal')">İptal</button>
            <button class="btn btn-primary" onclick="saveWorkingHours()">💾 Kaydet</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script th:replace="~{fragments/assets :: app-js}"></script>
<script th:replace="~{fragments/assets :: custom-select-js}"></script>
<script>
    let staffList = [];
    let accountsByStaffId = {};
    const CAN_MANAGE_ACCOUNTS = !!document.getElementById('canManageAccounts');
    const roleLabels = { SPECIALIST: 'Uzman', RECEPTIONIST: 'Resepsiyonist', ADMIN: 'Admin' };
    const specLabels = { HAIR: 'Saç', NAIL: 'Tırnak', SKIN: 'Cilt', LASER: 'Lazer', OTHER: 'Diğer' };
    function specLabel(c) { return specLabels[c] || c; }

    async function loadStaff() {
        const [staffRes, accountRes] = await Promise.all([
            api('GET', '/api/staff'),
            CAN_MANAGE_ACCOUNTS ? api('GET', '/api/staff/accounts') : Promise.resolve({ data: [] })
        ]);
        staffList = staffRes.data || [];
        accountsByStaffId = {};
        (accountRes.data || []).forEach(a => { accountsByStaffId[a.staffId] = a; });
        renderStaff();
    }

    function renderStaff() {
        const grid = document.getElementById('staffGrid');
        grid.innerHTML = staffList.map(s => `
            <div class="glass-card" style="position:relative;">
                <div style="position:absolute;top:0;left:0;right:0;height:4px;background:${s.colorHex};border-radius:16px 16px 0 0;"></div>
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
                    <div style="width:48px;height:48px;border-radius:12px;background:${s.colorHex}20;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">
                        👩‍💼
                    </div>
                    <div style="flex:1;">
                        <div style="font-weight:700;font-size:1.05rem;">${s.name}</div>
                        <div style="font-size:0.78rem;color:var(--text-secondary);">${roleLabels[s.role] || s.role}</div>
                    </div>
                </div>
                <div style="font-size:0.82rem;color:var(--text-secondary);">📞 ${s.phone || '-'}</div>
                <div style="font-size:0.82rem;color:var(--text-secondary);">✉️ ${s.email || '-'}</div>
                <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:4px;">
                    <span class="badge ${s.active ? 'badge-completed' : 'badge-cancelled'}">${s.active ? 'Aktif' : 'Pasif'}</span>
                    ${(s.specializations || []).map(c => `<span class="badge badge-scheduled">${specLabel(c)}</span>`).join('')}
                </div>
                ${accountRow(s)}
                <div style="display:flex;gap:8px;margin-top:12px;">
                    <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="editStaff(${s.id})">✏️ Düzenle</button>
                    <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="openWorkingHoursModal(${s.id},'${s.name}')">⏰ Saatler</button>
                </div>
            </div>
        `).join('');
    }

    // ─── Giriş Hesabı ───

    function accountRow(s) {
        if (!CAN_MANAGE_ACCOUNTS) return '';
        const acc = accountsByStaffId[s.id];
        if (!acc) {
            return `
                <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-glass);
                            display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                    <span style="font-size:0.8rem;color:var(--text-muted);flex:1;">🔒 Giriş hesabı yok</span>
                    <button class="btn btn-secondary btn-xs" onclick="createAccount(${s.id})">Hesap oluştur</button>
                </div>`;
        }
        const pending = acc.mustChangePassword
            ? ' <span class="badge badge-scheduled" title="Personel ilk girişinde parolasını değiştirecek">parola bekliyor</span>'
            : '';
        return `
            <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border-glass);
                        display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span style="font-size:0.8rem;color:var(--text-secondary);flex:1;">
                    🔑 <code>${acc.username}</code>${acc.enabled ? '' : ' <span class="badge badge-cancelled">kapalı</span>'}${pending}
                </span>
                <button class="btn btn-secondary btn-xs" onclick="resetAccountPassword(${s.id})">Parola sıfırla</button>
            </div>`;
    }

    function showCredentials(staffName, account) {
        document.getElementById('credStaffName').textContent = staffName;
        document.getElementById('credUsername').value = account.username;
        document.getElementById('credPassword').value = account.temporaryPassword;
        openModal('credentialsModal');
    }

    async function copyCredentials() {
        const text = 'Kullanıcı adı: ' + document.getElementById('credUsername').value
            + '\n' + 'Geçici parola: ' + document.getElementById('credPassword').value;
        try {
            await navigator.clipboard.writeText(text);
            showToast('Giriş bilgileri kopyalandı', 'success');
        } catch (e) {
            // Panoya erişim yoksa (güvensiz bağlam / izin reddi) kullanıcı elle seçebilsin.
            document.getElementById('credPassword').select();
            showToast('Kopyalanamadı, metni seçip kopyalayın', 'warning');
        }
    }

    async function createAccount(staffId) {
        const staff = staffList.find(x => x.id === staffId);
        const json = await api('POST', `/api/staff/${staffId}/account`);
        if (!json.success) {
            showToast(json.message || 'Hesap oluşturulamadı', 'error');
            return;
        }
        showCredentials(staff ? staff.name : '', json.data);
        loadStaff();
    }

    async function resetAccountPassword(staffId) {
        const staff = staffList.find(x => x.id === staffId);
        const name = staff ? staff.name : 'bu personel';
        if (!confirm(`${name} için yeni bir geçici parola oluşturulacak ve açık oturumları kapanacak. Devam edilsin mi?`)) return;
        const json = await api('POST', `/api/staff/${staffId}/account/reset-password`);
        if (!json.success) {
            showToast(json.message || 'Parola sıfırlanamadı', 'error');
            return;
        }
        showCredentials(staff ? staff.name : '', json.data);
        loadStaff();
    }

    function openStaffModal(s) {
        document.getElementById('editStaffId').value = s ? s.id : '';
        document.getElementById('stfName').value = s ? s.name : '';
        document.getElementById('stfPhone').value = s ? s.phone || '' : '';
        document.getElementById('stfEmail').value = s ? s.email || '' : '';
        document.getElementById('stfRole').value = s ? s.role : 'SPECIALIST';
        document.getElementById('stfColor').value = s ? s.colorHex : '#9b59b6';
        document.getElementById('staffModalTitle').textContent = s ? 'Personel Düzenle' : 'Yeni Personel';

        // Hesap yalnızca ekleme sırasında açılır; mevcut personelin hesabı karttan yönetilir.
        const showAccountOption = !s && CAN_MANAGE_ACCOUNTS;
        document.getElementById('accountOptionGroup').style.display = showAccountOption ? '' : 'none';
        document.getElementById('stfCreateAccount').checked = showAccountOption;

        // Uzmanlık checkboxlarını işaretle
        const specs = s ? (s.specializations || []) : [];
        document.querySelectorAll('#specializationCheckboxes input[type=checkbox]').forEach(cb => {
            cb.checked = specs.includes(cb.value);
        });

        openModal('staffModal');
    }

    function editStaff(id) {
        const s = staffList.find(x => x.id === id);
        if (s) openStaffModal(s);
    }

    async function saveStaff() {
        const id = document.getElementById('editStaffId').value;
        const body = {
            name: document.getElementById('stfName').value,
            phone: document.getElementById('stfPhone').value,
            email: document.getElementById('stfEmail').value,
            role: document.getElementById('stfRole').value,
            colorHex: document.getElementById('stfColor').value,
            active: true
        };
        const withAccount = !id && document.getElementById('stfCreateAccount').checked;
        const url = id ? `/api/staff/${id}` : `/api/staff?createAccount=${withAccount}`;
        const method = id ? 'PUT' : 'POST';
        const json = await api(method, url, body);
        if (!json.success) {
            showToast(json.message || 'İşlem başarısız', 'error');
            return;
        }

        // Ekleme yanıtı personeli ve — açıldıysa — hesabı birlikte taşır.
        const saved = id ? json.data : json.data?.staff;
        const account = id ? null : json.data?.account;
        const accountNote = id ? null : json.data?.accountNote;
        const savedId = saved?.id || id;
        if (savedId) {
            const selectedSpecs = Array.from(
                document.querySelectorAll('#specializationCheckboxes input[type=checkbox]:checked')
            ).map(cb => cb.value);
            await api('PUT', `/api/staff/${savedId}/specializations`, selectedSpecs);
        }

        showToast(json.message, 'success');
        closeModal('staffModal');
        await loadStaff();

        if (account) {
            showCredentials(body.name, account);
        } else if (accountNote) {
            showToast(accountNote, 'warning');
        }
    }

    loadStaff();

    // ─── Çalışma Saatleri ───
    const DAYS = [
        { key: 'MONDAY',    label: 'Pazartesi' },
        { key: 'TUESDAY',   label: 'Salı'      },
        { key: 'WEDNESDAY', label: 'Çarşamba'  },
        { key: 'THURSDAY',  label: 'Perşembe'  },
        { key: 'FRIDAY',    label: 'Cuma'      },
        { key: 'SATURDAY',  label: 'Cumartesi' },
        { key: 'SUNDAY',    label: 'Pazar'     },
    ];

    async function openWorkingHoursModal(staffId, staffName) {
        document.getElementById('whStaffId').value = staffId;
        document.getElementById('whStaffName').textContent = staffName;

        const json = await api('GET', `/api/staff/${staffId}/working-hours`);
        const existing = json.data || [];

        const tbody = document.getElementById('whRows');
        tbody.innerHTML = DAYS.map(d => {
            const wh = existing.find(w => w.dayOfWeek === d.key);
            const isDayOff = wh ? wh.dayOff : true;
            const start = wh && !wh.dayOff ? wh.startTime : '09:00';
            const end   = wh && !wh.dayOff ? wh.endTime   : '18:00';
            return `
            <tr style="border-bottom:1px solid var(--border-glass);">
                <td style="padding:8px;font-weight:500;">${d.label}</td>
                <td style="padding:8px;text-align:center;">
                    <input type="checkbox" id="dayoff_${d.key}" ${isDayOff ? 'checked' : ''}
                        onchange="toggleDayRow('${d.key}')">
                </td>
                <td style="padding:8px;">
                    <input type="time" class="form-input" id="start_${d.key}" value="${start}"
                        style="width:110px;padding:6px;" ${isDayOff ? 'disabled' : ''}>
                </td>
                <td style="padding:8px;">
                    <input type="time" class="form-input" id="end_${d.key}" value="${end}"
                        style="width:110px;padding:6px;" ${isDayOff ? 'disabled' : ''}>
                </td>
            </tr>`;
        }).join('');

        openModal('workingHoursModal');
    }

    function toggleDayRow(dayKey) {
        const isDayOff = document.getElementById(`dayoff_${dayKey}`).checked;
        document.getElementById(`start_${dayKey}`).disabled = isDayOff;
        document.getElementById(`end_${dayKey}`).disabled   = isDayOff;
    }

    async function saveWorkingHours() {
        const staffId = document.getElementById('whStaffId').value;
        const body = DAYS.map(d => ({
            dayOfWeek:  d.key,
            dayOff:     document.getElementById(`dayoff_${d.key}`).checked,
            startTime:  document.getElementById(`start_${d.key}`).value || null,
            endTime:    document.getElementById(`end_${d.key}`).value   || null,
        }));

        const json = await api('PUT', `/api/staff/${staffId}/working-hours`, body);
        if (json.success) {
            showToast('Çalışma saatleri kaydedildi', 'success');
            closeModal('workingHoursModal');
        } else {
            showToast(json.message || 'Kayıt başarısız', 'error');
        }
    }
</script>
</body>
</html>
