<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>GSCRM — Müşteriler</title>
    <link th:replace="~{fragments/assets :: styles}"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">💅</div>
            <div><h1>GSCRM</h1><span class="brand-sub">Salon CRM</span></div>
        </div>
        <nav th:replace="~{fragments/sidebar-nav :: nav('customers')}"></nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" id="menuToggle" aria-label="Menüyü Aç">☰</button>
                <span class="topbar-title">👥 Müşteriler</span>
            </div>
            <div class="topbar-actions">
                <span style="color:var(--text-secondary);font-size:0.9rem;">👤 <span sec:authentication="name">user</span></span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary btn-xs">Çıkış</button>
                </form>
            </div>
        </header>

        <div class="page-content" style="display:flex;gap:20px;align-items:flex-start;">
            <!-- Sol: Liste -->
            <div style="width:340px;flex-shrink:0;">
                <div class="crud-header" style="margin-bottom:12px;">
                    <h2 style="font-size:1.1rem;">Müşteri Listesi</h2>
                    <button class="btn btn-primary btn-sm" onclick="openCustomerModal()">➕ Yeni</button>
                </div>
                <div class="search-bar" style="margin-bottom:12px;">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="customerSearch" placeholder="İsim, telefon veya e-posta..."
                           oninput="searchCustomers(this.value)">
                </div>
                <div id="duplicateBanner" style="display:none;background:rgba(241,196,15,0.12);border:1px solid rgba(241,196,15,0.35);border-radius:var(--radius-sm);padding:10px;margin-bottom:10px;font-size:0.82rem;"></div>
                <div id="customerList" style="display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 220px);overflow-y:auto;"></div>
            </div>

            <!-- Sağ: Detay -->
            <div style="flex:1;min-width:0;" id="detailPane">
                <div class="glass-card" style="padding:40px;text-align:center;color:var(--text-muted);">
                    <div style="font-size:3rem;margin-bottom:12px;">👥</div>
                    <p>Detayları görüntülemek için bir müşteri seçin</p>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Olası Yinelenen Müşteriler -->
<div class="modal-overlay" id="duplicateModal">
    <div class="modal" style="max-width:520px;">
        <div class="modal-header">
            <h3>Olası Yinelenen Müşteriler</h3>
            <button class="modal-close" onclick="closeModal('duplicateModal')">✕</button>
        </div>
        <div class="modal-body" id="duplicateModalBody"></div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('duplicateModal')">Kapat</button>
        </div>
    </div>
</div>

<!-- Müşteri Ekle/Düzenle Modalı -->
<div class="modal-overlay" id="customerModal">
    <div class="modal" style="max-width:480px;">
        <div class="modal-header">
            <h3 id="customerModalTitle">Yeni Müşteri</h3>
            <button class="modal-close" onclick="closeModal('customerModal')">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editCustomerId">
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Ad *</label>
                    <input type="text" class="form-input" id="cstFirstName" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Soyad</label>
                    <input type="text" class="form-input" id="cstLastName">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Telefon</label>
                    <input type="text" class="form-input" id="cstPhone" placeholder="05XX XXX XXXX">
                </div>
                <div class="form-group">
                    <label class="form-label">E-posta</label>
                    <input type="email" class="form-input" id="cstEmail">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Notlar</label>
                <textarea class="form-textarea" id="cstNotes" placeholder="Allerji, tercih vb."></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('customerModal')">İptal</button>
            <button class="btn btn-primary" onclick="saveCustomer()">💾 Kaydet</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script th:replace="~{fragments/assets :: app-js}"></script>
<script th:replace="~{fragments/assets :: custom-select-js}"></script>
<script src="/js/customers.js"></script>
</body>
</html>
