<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <meta name="salon-id" content="1"/>
    <title>GSCRM — Randevu Takvimi</title>
    <link th:replace="~{fragments/assets :: styles}"/>
    <link rel="stylesheet" media="print" href="/css/print.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
</head>
<body class="page-calendar">
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">💅</div>
            <div><h1>GSCRM</h1><span class="brand-sub">Salon Yönetim Sistemi</span></div>
        </div>
        <nav th:replace="~{fragments/sidebar-nav :: nav('calendar')}"></nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" id="menuToggle" aria-label="Menüyü Aç">☰</button>
                <span class="topbar-title">📅 Randevu Takvimi</span>
            </div>
            <div class="topbar-actions">
                <div class="ws-status" id="wsStatus">
                    <span class="ws-dot"></span>
                    <span class="ws-label">Bağlanıyor...</span>
                </div>
                <button class="btn btn-primary" onclick="openCreateModal()">➕ Yeni Randevu</button>
                <span style="color:var(--color-text-muted);font-size:0.9rem;">👤 <span sec:authentication="name">user</span></span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary btn-xs">Çıkış</button>
                </form>
            </div>
        </header>

        <div class="page-content page-content--calendar">
            <div class="staff-legend" id="staffLegend"></div>
            <div class="glass-card calendar-shell">
                <div id="calendar"></div>
            </div>
        </div>
    </main>
</div>

<!-- Create/Edit Appointment Modal -->
<div class="modal-overlay" id="appointmentModal">
    <div class="modal" style="max-width:600px;">
        <div class="modal-header">
            <h3 id="modalTitle">Yeni Randevu</h3>
            <button class="modal-close" onclick="closeModal('appointmentModal')">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editAppointmentId">
            <input type="hidden" id="editVersion">

            <!-- Kayıtlı müşteri seçimi -->
            <div class="form-group" style="position:relative;">
                <label class="form-label">Kayıtlı Müşteri Ara</label>
                <input type="text" class="form-input" id="customerSearchInput" placeholder="İsim veya telefon yazın..." autocomplete="off">
                <input type="hidden" id="selectedCustomerId">
                <div id="customerSearchSuggestions" class="autocomplete-dropdown"></div>
            </div>
            <div id="recentCustomersRow" class="recent-customers-row"></div>
            <div style="margin-bottom:12px;">
                <button type="button" class="btn btn-sm btn-secondary" id="repeatLastBtn" disabled onclick="applyLastAppointment()">
                    ↻ Son randevunun aynısı
                </button>
                <span id="repeatLastHint" style="font-size:0.75rem;color:var(--text-muted);margin-left:8px;">Kayıtlı müşteri seçin</span>
            </div>

            <!-- Customer: free text -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Müşteri Adı *</label>
                    <input type="text" class="form-input" id="customerNameInput" placeholder="Ad Soyad" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Telefon</label>
                    <input type="text" class="form-input" id="customerPhoneInput" placeholder="05XX XXX XXXX">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Uzman *</label>
                    <select class="form-select" id="staffSelect" required>
                        <option value="">Uzman seçin...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Hizmet *</label>
                    <select class="form-select" id="serviceSelect" required onchange="onServiceChange()">
                        <option value="">Hizmet seçin...</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Tarih *</label>
                    <input type="date" class="form-input" id="dateInput" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Saat *</label>
                    <input type="time" class="form-input" id="timeInput" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Süre (dk)</label>
                    <input type="number" class="form-input" id="durationDisplay" readonly>
                </div>
                <div class="form-group">
                    <label class="form-label">Taban Fiyat (₺)</label>
                    <input type="number" class="form-input" id="basePriceDisplay" readonly>
                </div>
            </div>

            <!-- Price adjustment -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Ek Ücret / İndirim (₺)</label>
                    <input type="number" class="form-input" id="adjustmentInput" step="1" value="0" oninput="updateFinalPrice()">
                </div>
                <div class="form-group">
                    <label class="form-label">Açıklama</label>
                    <input type="text" class="form-input" id="adjustmentNoteInput" placeholder="ör: +150 ek boya, -80 VIP">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Son Fiyat (₺)</label>
                <input type="number" class="form-input" id="finalPriceInput" step="0.01" style="font-weight:700;font-size:1.1rem;color:var(--color-accent);">
            </div>

            <!-- Session support -->
            <div class="form-row" id="sessionRow" style="display:none;">
                <div class="form-group">
                    <label class="form-label">Seans Sayısı</label>
                    <input type="number" class="form-input" id="sessionCountInput" min="1" value="1" oninput="updateSessionInfo()">
                </div>
                <div class="form-group">
                    <label class="form-label">Tercih Edilen Gün</label>
                    <select class="form-select" id="preferredDaySelect">
                        <option value="">Bugün ile aynı</option>
                        <option value="MONDAY">Pazartesi</option>
                        <option value="TUESDAY">Salı</option>
                        <option value="WEDNESDAY">Çarşamba</option>
                        <option value="THURSDAY">Perşembe</option>
                        <option value="FRIDAY">Cuma</option>
                        <option value="SATURDAY">Cumartesi</option>
                    </select>
                </div>
            </div>
            <div id="sessionInfo" class="form-group" style="display:none;">
                <div style="padding:8px 12px;background:rgba(155,89,182,0.1);border:1px solid rgba(155,89,182,0.3);border-radius:8px;font-size:0.82rem;color:var(--color-primary-light);">
                    📅 <span id="sessionInfoText"></span>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Not</label>
                <textarea class="form-textarea" id="noteInput" placeholder="İç not ekleyin..."></textarea>
            </div>

            <div class="form-group">
                <label class="form-label">Hızlı Notlar</label>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button type="button" class="btn btn-xs btn-secondary flag-toggle" data-flag="ALLERGY" data-icon="⚠️">⚠️ Alerji</button>
                    <button type="button" class="btn btn-xs btn-secondary flag-toggle" data-flag="VIP" data-icon="⭐">⭐ VIP</button>
                    <button type="button" class="btn btn-xs btn-secondary flag-toggle" data-flag="DRINK" data-icon="☕">☕ İçecek</button>
                    <button type="button" class="btn btn-xs btn-secondary flag-toggle" data-flag="PREFERENCE" data-icon="🎯">🎯 Tercih</button>
                </div>
                <input type="text" class="form-input" id="flagValueInput" placeholder="Not detayı (ör: Kahvesi sade)" style="margin-top:8px;">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('appointmentModal')">İptal</button>
            <button class="btn btn-primary" onclick="saveAppointment()">💾 Kaydet</button>
        </div>
    </div>
</div>

<!-- View Appointment Modal -->
<div class="modal-overlay" id="viewModal">
    <div class="modal" style="max-width:560px;">
        <div class="modal-header">
            <h3>Randevu Detayı</h3>
            <button class="modal-close" onclick="closeModal('viewModal')">✕</button>
        </div>
        <div class="modal-body" id="viewModalBody"></div>
        <div class="modal-footer" id="viewModalFooter"></div>
    </div>
</div>

<!-- Status Change Modal (with reason) -->
<div class="modal-overlay" id="statusModal">
    <div class="modal" style="max-width:420px;">
        <div class="modal-header">
            <h3 id="statusModalTitle">Durum Değiştir</h3>
            <button class="modal-close" onclick="closeModal('statusModal')">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="statusAppointmentId">
            <input type="hidden" id="statusNewValue">
            <div class="form-group">
                <label class="form-label">Neden (opsiyonel)</label>
                <select class="form-select" id="statusReasonSelect">
                    <option value="">Neden seçin...</option>
                    <option value="Müşteri gelmedi">Müşteri gelmedi</option>
                    <option value="Müşteri iptal etti">Müşteri iptal etti</option>
                    <option value="Personel müsait değil">Personel müsait değil</option>
                    <option value="Randevu ertelendi">Randevu ertelendi</option>
                    <option value="Diğer">Diğer</option>
                </select>
            </div>
            <div class="form-group" id="statusReasonCustomGroup" style="display:none;">
                <input type="text" class="form-input" id="statusReasonCustom" placeholder="Özel neden yazın...">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('statusModal')">İptal</button>
            <button class="btn btn-primary" onclick="confirmStatusChange()">✅ Onayla</button>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script th:replace="~{fragments/assets :: app-js}"></script>
<script th:replace="~{fragments/assets :: custom-select-js}"></script>
<script src="/js/websocket.js"></script>
<script src="/js/calendar.js"></script>
</body>
</html>
