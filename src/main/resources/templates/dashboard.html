<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>GSERP — Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" media="print" href="/css/print.css">
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
        .stat-card {
            background: var(--surface-light);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .stat-icon {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            background: rgba(255,255,255,0.05);
        }
        .stat-info h4 {
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .stat-info .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .perf-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        
        .perf-card {
            background: var(--surface-light);
            border-radius: 12px;
            padding: 16px;
            border-left: 4px solid var(--staff-color, #fff);
        }
    </style>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">💅</div>
            <div><h1>GSERP</h1><span class="brand-sub">Salon Yönetim Sistemi</span></div>
        </div>
        <nav class="sidebar-nav">
            <span class="nav-section-title">Ana Menü</span>
            <a href="/" class="nav-item"><span class="nav-icon">📅</span> Takvim</a>
            <a href="/dashboard" class="nav-item active"><span class="nav-icon">📊</span> Dashboard</a>
            <span class="nav-section-title">Yönetim</span>
            <a href="/services" class="nav-item"><span class="nav-icon">💇</span> Hizmetler</a>
            <a href="/staff" class="nav-item"><span class="nav-icon">👩‍💼</span> Personel</a>
            <a href="/resources" class="nav-item"><span class="nav-icon">🏠</span> Kaynaklar</a>
            <span class="nav-section-title">Sistem</span>
            <a href="/audit" class="nav-item"><span class="nav-icon">📋</span> İşlem Kütüğü</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <span class="topbar-title">📊 Dashboard</span>
            </div>
            <div class="topbar-actions">
                <input type="date" id="dashDate" class="form-input" style="width:160px;" onchange="loadDashboard()">
                <button class="btn btn-secondary" onclick="window.print()">🖨️ Rapor Yazdır</button>
                <span style="color:var(--color-text-muted);font-size:0.9rem;">👤 <span sec:authentication="name">user</span></span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary btn-xs">Çıkış</button>
                </form>
            </div>
        </header>

        <div class="page-content" id="print-area">
            <div class="glass-card" style="padding:24px;">
                <h3 id="dashTitle" style="font-size:1.4rem;">Günün Özeti</h3>
                <p class="text-secondary" id="dashDateHint">Yükleniyor...</p>

                <div class="dashboard-grid">
                    <div class="stat-card">
                        <div class="stat-icon" style="color:#3498db;background:rgba(52,152,219,0.1)">📅</div>
                        <div class="stat-info">
                            <h4>TOPLAM İŞLEM</h4>
                            <div class="value" id="valTotal">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="color:#2ecc71;background:rgba(46,204,113,0.1)">✅</div>
                        <div class="stat-info">
                            <h4>TAMAMLANAN</h4>
                            <div class="value" id="valCompleted">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="color:#f39c12;background:rgba(243,156,18,0.1)">💰</div>
                        <div class="stat-info">
                            <h4>GÜNLÜK CİRO</h4>
                            <div class="value" id="valRevenue" style="color:#f39c12">-</div>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon" style="color:#e74c3c;background:rgba(231,76,60,0.1)">👻</div>
                        <div class="stat-info">
                            <h4>NO-SHOW</h4>
                            <div class="value" id="valNoShow" style="color:#e74c3c">-</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="glass-card" style="padding:24px;margin-top:24px;">
                <h3 style="font-size:1.2rem;margin-bottom:8px;">👩‍💼 Personel Performansı</h3>
                <div class="perf-grid" id="staffPerfContainer">
                    <!-- Staff stats will be injected here -->
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('dashDate').value = todayISO();
    loadDashboard();
});

async function loadDashboard() {
    const dateInput = document.getElementById('dashDate').value || todayISO();
    try {
        const res = await fetch(`/api/dashboard?date=${dateInput}`);
        const json = await res.json();
        const d = json.data;

        document.getElementById('dashDateHint').textContent = `${formatDate(dateInput)} tarihli veriler`;

        document.getElementById('valTotal').textContent = d.totalAppointments;
        document.getElementById('valCompleted').textContent = `${d.completedAppointments} / ${d.scheduledAppointments + d.inProgressAppointments + d.completedAppointments}`;
        document.getElementById('valRevenue').textContent = formatCurrency(d.totalRevenue);
        document.getElementById('valNoShow').textContent = d.noShows;
        
        // Render Staff Performance
        const container = document.getElementById('staffPerfContainer');
        if (d.staffPerformance && d.staffPerformance.length > 0) {
            container.innerHTML = d.staffPerformance.map(s => {
                const completionRate = s.totalAppointments ? Math.round((s.completed / s.totalAppointments) * 100) : 0;
                return `
                <div class="perf-card" style="--staff-color:${s.staffColor}">
                    <div style="font-weight:600;font-size:1.1rem;margin-bottom:12px;">${s.staffName}</div>
                    <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:0.9rem;">
                        <span class="text-secondary">İşlem:</span>
                        <strong>${s.completed}/${s.totalAppointments}</strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:0.9rem;">
                        <span class="text-secondary">Ciro:</span>
                        <strong>${formatCurrency(s.revenue)}</strong>
                    </div>
                    <div style="display:flex;justify-content:space-between;font-size:0.9rem;">
                        <span class="text-secondary">No-Show:</span>
                        <strong style="color:var(--color-danger)">${s.noShows}</strong>
                    </div>
                    <div style="margin-top:12px;height:6px;background:rgba(255,255,255,0.1);border-radius:3px;overflow:hidden;">
                        <div style="height:100%;width:${completionRate}%;background:${s.staffColor}"></div>
                    </div>
                </div>
                `;
            }).join('');
        } else {
            container.innerHTML = '<div class="text-secondary">Kayıtlı veri bulunamadı.</div>';
        }

    } catch (e) {
        showToast('Veriler yüklenirken hata oluştu', 'error');
    }
}
</script>
</body>
</html>
