<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSERP — Org Dashboard</title>
    <link th:replace="~{fragments/assets :: styles}"/>
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <div class="sidebar-brand">GSERP Org</div>
        <nav th:replace="~{fragments/sidebar-nav :: nav('org')}"></nav>
    </aside>
    <main class="main-content">
        <h1>Organizasyon Özeti</h1>
        <div id="orgSummary">Yükleniyor...</div>
        <h2 style="margin-top:24px;">Şubeler</h2>
        <div id="salonList"></div>
    </main>
</div>
<script>
async function load() {
    const [summaryRes, salonsRes] = await Promise.all([
        fetch('/api/org/summary'),
        fetch('/api/org/salons')
    ]);
    const summary = await summaryRes.json();
    const salons = await salonsRes.json();
    if (summary.success && summary.data) {
        const s = summary.data;
        document.getElementById('orgSummary').innerHTML = `
            <p><strong>${s.organizationName}</strong> — ${s.salonCount} şube</p>
            <p>Bugün: ${s.totalAppointmentsToday} randevu, ${s.totalRevenueToday} ₺ ciro</p>`;
        document.getElementById('salonList').innerHTML = (s.salons || []).map(x =>
            `<div class="stat-card" style="margin-bottom:8px;">${x.name} (${x.slug}) — ${x.appointmentsToday} randevu, ${x.revenueToday} ₺</div>`
        ).join('');
    }
}
load();
</script>
</body>
</html>
