<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSCRM — Giriş</title>
    <link th:replace="~{fragments/assets :: styles}"/>
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;">
    <div class="glass-card" style="width:100%;max-width:420px;padding:32px;">
        <div style="text-align:center;margin-bottom:24px;">
            <div style="font-size:48px;">💅</div>
            <h1 style="margin:8px 0 4px;">GSCRM</h1>
            <span style="color:var(--color-text-muted);font-size:0.9rem;">Salon CRM</span>
        </div>

        <div th:if="${param.error}" style="margin-bottom:16px;padding:10px 14px;background:rgba(231,76,60,0.1);border:1px solid rgba(231,76,60,0.3);border-radius:8px;color:#e74c3c;font-size:0.9rem;">
            ⚠️ Kullanıcı adı veya parola hatalı.
        </div>
        <div th:if="${param.logout}" style="margin-bottom:16px;padding:10px 14px;background:rgba(46,204,113,0.1);border:1px solid rgba(46,204,113,0.3);border-radius:8px;color:#2ecc71;font-size:0.9rem;">
            ✅ Çıkış yapıldı.
        </div>

        <form method="post" th:action="@{/login}">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="form-group">
                <label class="form-label" for="username">Kullanıcı Adı</label>
                <input type="text" class="form-input" id="username" name="username" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Parola</label>
                <input type="password" class="form-input" id="password" name="password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Giriş Yap</button>
        </form>
        <p style="margin-top:16px;text-align:center;font-size:0.9rem;">
            <a href="/onboarding/wizard">Davet kodunuz varsa kayıt olun</a>
        </p>
    </div>
</div>
</body>
</html>
