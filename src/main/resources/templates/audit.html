<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>GSCRM — İşlem Kütüğü</title>
    <link th:replace="~{fragments/assets :: styles}"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">💅</div>
            <div><h1>GSCRM</h1><span class="brand-sub">Salon Yönetim Sistemi</span></div>
        </div>
        <nav th:replace="~{fragments/sidebar-nav :: nav('audit')}"></nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" id="menuToggle" aria-label="Menüyü Aç">☰</button>
                <span class="topbar-title">📋 İşlem Kütüğü</span>
            </div>
            <div class="topbar-actions">
                <button class="btn btn-secondary" onclick="loadAudit()">🔄 Yenile</button>
                <span style="color:var(--color-text-muted);font-size:0.9rem;">👤 <span sec:authentication="name">user</span></span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary btn-xs">Çıkış</button>
                </form>
            </div>
        </header>
        <div class="page-content">
            <div class="glass-card" style="padding:0;overflow:hidden;">
                <table class="data-table">
                    <thead>
                        <tr><th>Zaman</th><th>İşlem</th><th>Tür</th><th>ID</th><th>Eski Değer</th><th>Yeni Değer</th></tr>
                    </thead>
                    <tbody id="auditTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>
<script th:replace="~{fragments/assets :: app-js}"></script>
<script th:replace="~{fragments/assets :: custom-select-js}"></script>
<script>
    const actionLabels = { CREATE: '🟢 Oluşturma', UPDATE: '🟡 Güncelleme', DELETE: '🔴 Silme', STATUS_CHANGE: '🔵 Durum Değişikliği' };

    async function loadAudit() {
        const res = await fetch('/api/audit?limit=100');
        const json = await res.json();
        const logs = (json.data || []).reverse();
        document.getElementById('auditTableBody').innerHTML = logs.map(l => `
            <tr>
                <td style="font-variant-numeric:tabular-nums;font-size:0.8rem;">${l.createdAt ? new Date(l.createdAt).toLocaleString('tr-TR') : '-'}</td>
                <td>${actionLabels[l.action] || l.action}</td>
                <td><span class="badge badge-scheduled">${l.entityType}</span></td>
                <td>#${l.entityId}</td>
                <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;" title="${l.oldValue || ''}">${l.oldValue || '—'}</td>
                <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;" title="${l.newValue || ''}">${l.newValue || '—'}</td>
            </tr>
        `).join('');
    }

    loadAudit();
</script>
</body>
</html>
