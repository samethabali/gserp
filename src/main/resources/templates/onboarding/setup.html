<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>GSCRM — Kurulum Sihirbazı</title>
    <link th:replace="~{fragments/assets :: styles}"/>
</head>
<body style="min-height:100vh;background:var(--bg-primary);">
<div id="toastContainer" class="toast-container"></div>
<div class="onboarding-shell">
    <div class="glass-card onboarding-card">
        <h1>Salon Kurulumu</h1>
        <p class="settings-desc">4 adımda salonunuzu kullanıma hazırlayın.</p>

        <div class="onboarding-steps" id="stepIndicators"></div>

        <div id="stepPanel" class="onboarding-panel"></div>

        <div class="onboarding-actions">
            <button type="button" class="btn btn-secondary" id="btnBack" style="display:none;">← Geri</button>
            <button type="button" class="btn btn-primary" id="btnNext">İleri →</button>
        </div>
    </div>
</div>
<script th:replace="~{fragments/assets :: app-js}"></script>
<script>
const STEPS = [
    { key: 'SALON_INFO', title: 'Salon bilgileri', icon: '🏪' },
    { key: 'SERVICES', title: 'Hizmetler', icon: '💇' },
    { key: 'STAFF', title: 'Personel', icon: '👩‍💼' },
    { key: 'COMPLETED', title: 'Tamamlandı', icon: '✅' }
];

let currentIndex = 0;
let salonSettings = {};

function stepIndex(key) {
    const i = STEPS.findIndex(s => s.key === key);
    return i >= 0 ? i : 0;
}

function renderIndicators() {
    const el = document.getElementById('stepIndicators');
    el.innerHTML = STEPS.map((s, i) =>
        `<div class="onboarding-step-dot${i === currentIndex ? ' active' : ''}${i < currentIndex ? ' done' : ''}" title="${s.title}" aria-current="${i === currentIndex ? 'step' : 'false'}">${s.icon}<span class="step-label">${s.title}</span></div>`
    ).join('');
}

const DEFAULT_PRIMARY_COLOR = '#e91e8c';

const COLOR_PALETTE = [
    { hex: '#e91e8c', name: 'Fuşya' },
    { hex: '#d81b60', name: 'Gül' },
    { hex: '#e74c3c', name: 'Kırmızı' },
    { hex: '#e67e22', name: 'Turuncu' },
    { hex: '#f39c12', name: 'Amber' },
    { hex: '#2ecc71', name: 'Yeşil' },
    { hex: '#16a085', name: 'Zümrüt' },
    { hex: '#00b8d4', name: 'Turkuaz' },
    { hex: '#3498db', name: 'Mavi' },
    { hex: '#6c5ce7', name: 'Lavanta' },
    { hex: '#9b59b6', name: 'Mor' },
    { hex: '#607d8b', name: 'Antrasit' }
];

// "#abc" / "abcdef" gibi girdileri "#aabbcc" biçimine çevirir; geçersizse null.
function normalizeHex(value) {
    const raw = (value || '').trim().replace(/^#/, '');
    if (/^[0-9a-fA-F]{3}$/.test(raw)) {
        return '#' + raw.split('').map(c => c + c).join('').toLowerCase();
    }
    if (/^[0-9a-fA-F]{6}$/.test(raw)) {
        return '#' + raw.toLowerCase();
    }
    return null;
}

function panelSalonInfo() {
    const swatches = COLOR_PALETTE.map(c =>
        `<button type="button" class="color-swatch" data-color="${c.hex}" style="color:${c.hex};" title="${c.name} (${c.hex})" aria-label="${c.name}" aria-pressed="false">
            <span class="color-swatch-dot" style="background:${c.hex};"></span>
            <span>${c.name}</span>
        </button>`
    ).join('');

    return `
        <h2>Salon görünümü</h2>
        <p class="settings-desc">Booking sayfasında görünecek ad ve renk.</p>
        <div class="form-group">
            <label class="form-label">Salon adı</label>
            <input type="text" class="form-input" id="obSalonName">
        </div>
        <div class="form-group">
            <label class="form-label">Ana renk</label>
            <div class="color-palette" id="obColorPalette" role="group" aria-label="Hazır renk paleti">${swatches}</div>
            <div class="color-custom-row">
                <input type="color" id="obColorWheel" aria-label="Özel renk seç">
                <input type="text" class="form-input" id="obPrimaryColor" placeholder="${DEFAULT_PRIMARY_COLOR}" maxlength="7" spellcheck="false" aria-label="Renk kodu (hex)">
                <span class="color-preview-chip" id="obColorPreview">Önizleme</span>
            </div>
        </div>`;
}

// Palet, renk tekeri ve hex kutusunu tek seçili değer üzerinden senkron tutar.
function initColorPicker(initial) {
    const palette = document.getElementById('obColorPalette');
    const wheel = document.getElementById('obColorWheel');
    const hexInput = document.getElementById('obPrimaryColor');
    const preview = document.getElementById('obColorPreview');

    function apply(hex, syncHexInput) {
        wheel.value = hex;
        preview.style.background = hex;
        if (syncHexInput) hexInput.value = hex;
        palette.querySelectorAll('.color-swatch').forEach(btn => {
            const on = btn.dataset.color === hex;
            btn.classList.toggle('selected', on);
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
    }

    palette.addEventListener('click', e => {
        const btn = e.target.closest('.color-swatch');
        if (btn) apply(btn.dataset.color, true);
    });

    wheel.addEventListener('input', () => apply(wheel.value.toLowerCase(), true));

    hexInput.addEventListener('input', () => {
        const hex = normalizeHex(hexInput.value);
        if (hex) apply(hex, false);
    });

    hexInput.addEventListener('blur', () => {
        apply(normalizeHex(hexInput.value) || DEFAULT_PRIMARY_COLOR, true);
    });

    apply(normalizeHex(initial) || DEFAULT_PRIMARY_COLOR, true);
}

function panelServices() {
    return `
        <h2>İlk hizmetleriniz</h2>
        <p class="settings-desc">En az bir hizmet ekleyerek randevu almaya başlayın.</p>
        <p id="serviceCount" class="settings-desc">Yükleniyor…</p>
        <a href="/services" class="btn btn-secondary" target="_blank">Hizmetler sayfasını aç →</a>`;
}

function panelStaff() {
    return `
        <h2>Personel</h2>
        <p class="settings-desc">Uzman ve resepsiyon ekibinizi tanımlayın.</p>
        <p id="staffCount" class="settings-desc">Yükleniyor…</p>
        <a href="/staff" class="btn btn-secondary" target="_blank">Personel sayfasını aç →</a>`;
}

// Kanonik adres /{slug}; "/booking" yalnızca oturumdaki kiracıyla çözülür ve
// paylaşıldığında "işletme seçilmedi" hatası verir.
function bookingPath() {
    const slug = document.querySelector('meta[name="current-salon-slug"]')?.content?.trim();
    return slug ? '/' + slug : '/booking';
}

function panelCompleted() {
    return `
        <h2>Kurulum tamamlandı 🎉</h2>
        <p class="settings-desc">Takvimden randevu oluşturabilir veya booking sayfanızı paylaşabilirsiniz.</p>
        <a href="/" class="btn btn-primary">Takvime git</a>
        <a href="${bookingPath()}" class="btn btn-secondary" target="_blank" style="margin-left:8px;">Booking sayfası</a>`;
}

const PANELS = [panelSalonInfo, panelServices, panelStaff, panelCompleted];

function showStep(index) {
    currentIndex = index;
    renderIndicators();
    document.getElementById('stepPanel').innerHTML = PANELS[index]();
    document.getElementById('btnBack').style.display = index > 0 && index < STEPS.length - 1 ? 'inline-flex' : 'none';
    document.getElementById('btnNext').textContent = index === STEPS.length - 1 ? 'Bitti' : (index === STEPS.length - 2 ? 'Tamamla' : 'İleri →');
    document.getElementById('btnNext').style.display = index === STEPS.length - 1 ? 'none' : 'inline-flex';

    if (index === 0) {
        document.getElementById('obSalonName').value = salonSettings.name || '';
        initColorPicker(salonSettings.primaryColor);
    }
    if (index === 1) loadServiceCount();
    if (index === 2) loadStaffCount();
}

async function loadServiceCount() {
    const json = await api('GET', '/api/services');
    const count = (json.data || []).length;
    document.getElementById('serviceCount').textContent = count > 0
        ? `✓ ${count} hizmet tanımlı.`
        : 'Henüz hizmet yok — en az bir tane ekleyin.';
}

async function loadStaffCount() {
    const json = await api('GET', '/api/staff');
    const count = (json.data || []).length;
    document.getElementById('staffCount').textContent = count > 0
        ? `✓ ${count} personel kayıtlı.`
        : 'Henüz personel yok — en az bir uzman ekleyin.';
}

async function saveCurrentStep() {
    const stepKey = STEPS[currentIndex].key;
    if (stepKey === 'SALON_INFO') {
        const body = {
            name: document.getElementById('obSalonName').value.trim(),
            primaryColor: normalizeHex(document.getElementById('obPrimaryColor').value) || DEFAULT_PRIMARY_COLOR,
            logoUrl: salonSettings.logoUrl || ''
        };
        const json = await api('PUT', '/api/settings', body);
        if (!json.success) {
            showToast(json.message || 'Kaydedilemedi', 'error');
            return false;
        }
        // Adıma geri dönüldüğünde seçilen renk korunsun.
        salonSettings = Object.assign({}, salonSettings, body);
    }

    const nextKey = currentIndex < STEPS.length - 1 ? STEPS[currentIndex + 1].key : 'COMPLETED';
    const json = await api('PUT', '/api/onboarding/steps', { currentStep: nextKey });
    if (!json.success) {
        showToast(json.message || 'Adım güncellenemedi', 'error');
        return false;
    }
    return true;
}

async function init() {
    const settingsRes = await api('GET', '/api/settings');
    if (settingsRes.success && settingsRes.data) {
        salonSettings = settingsRes.data;
    }

    const stepsRes = await api('GET', '/api/onboarding/steps');
    if (stepsRes.success && stepsRes.data) {
        const key = stepsRes.data.currentStep || 'SALON_INFO';
        if (key === 'COMPLETED') {
            currentIndex = STEPS.length - 1;
        } else {
            currentIndex = stepIndex(key);
        }
    }
    showStep(currentIndex);
}

document.getElementById('btnNext').addEventListener('click', async () => {
    if (currentIndex >= STEPS.length - 1) return;
    const ok = await saveCurrentStep();
    if (!ok) return;
    if (currentIndex === STEPS.length - 2) {
        showStep(STEPS.length - 1);
    } else {
        showStep(currentIndex + 1);
    }
});

document.getElementById('btnBack').addEventListener('click', () => {
    if (currentIndex > 0) showStep(currentIndex - 1);
});

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
