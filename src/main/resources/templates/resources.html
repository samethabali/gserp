<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>GSERP — Kaynaklar</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">💅</div>
            <div><h1>GSERP</h1><span class="brand-sub">Salon Yönetim Sistemi</span></div>
        </div>
        <nav th:replace="~{fragments/sidebar-nav :: nav('resources')}"></nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" id="menuToggle" aria-label="Menüyü Aç">☰</button>
                <span class="topbar-title">🏠 Kaynak Yönetimi</span>
            </div>
            <div class="topbar-actions">
                <span style="color:var(--color-text-muted);font-size:0.9rem;">👤 <span sec:authentication="name">user</span></span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary btn-xs">Çıkış</button>
                </form>
            </div>
        </header>
        <div class="page-content">
            <div class="crud-header">
                <h2>Kaynaklar</h2>
                <button class="btn btn-primary" onclick="openResModal()">➕ Yeni Kaynak</button>
            </div>
            <div class="glass-card" style="padding:0;overflow:hidden;">
                <table class="data-table">
                    <thead>
                        <tr><th>Ad</th><th>Tip</th><th>Kapasite</th><th>Durum</th><th>İşlem</th></tr>
                    </thead>
                    <tbody id="resTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="resModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="resModalTitle">Yeni Kaynak</h3>
            <button class="modal-close" onclick="closeModal('resModal')">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editResId">
            <div class="form-group">
                <label class="form-label">Kaynak Adı</label>
                <input type="text" class="form-input" id="resName" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Tip</label>
                    <select class="form-select" id="resType">
                        <option value="ROOM">Oda</option>
                        <option value="DEVICE">Cihaz</option>
                        <option value="EQUIPMENT">Ekipman</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Kapasite</label>
                    <input type="number" class="form-input" id="resCapacity" value="1" min="1">
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('resModal')">İptal</button>
            <button class="btn btn-primary" onclick="saveResource()">💾 Kaydet</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/app.js"></script>
<script>
    const typeLabels = { ROOM: '🚪 Oda', DEVICE: '⚙️ Cihaz', EQUIPMENT: '🛋️ Ekipman' };
    let resources = [];

    async function loadResources() {
        const json = await api('GET', '/api/resources');
        resources = json.data || [];
        renderResources();
    }

    function renderResources() {
        document.getElementById('resTableBody').innerHTML = resources.map(r => `
            <tr>
                <td><strong>${r.name}</strong></td>
                <td>${typeLabels[r.resourceType] || r.resourceType}</td>
                <td>${r.capacity}</td>
                <td><span class="badge ${r.active ? 'badge-completed' : 'badge-cancelled'}">${r.active ? 'Aktif' : 'Pasif'}</span></td>
                <td><button class="btn btn-xs btn-secondary" onclick="editResource(${r.id})">✏️</button></td>
            </tr>
        `).join('');
    }

    function openResModal(r) {
        document.getElementById('editResId').value = r ? r.id : '';
        document.getElementById('resName').value = r ? r.name : '';
        document.getElementById('resType').value = r ? r.resourceType : 'ROOM';
        document.getElementById('resCapacity').value = r ? r.capacity : 1;
        document.getElementById('resModalTitle').textContent = r ? 'Kaynak Düzenle' : 'Yeni Kaynak';
        openModal('resModal');
    }

    function editResource(id) {
        const r = resources.find(x => x.id === id);
        if (r) openResModal(r);
    }

    async function saveResource() {
        const id = document.getElementById('editResId').value;
        const body = {
            name: document.getElementById('resName').value,
            resourceType: document.getElementById('resType').value,
            capacity: parseInt(document.getElementById('resCapacity').value),
            active: true
        };
        const url = id ? `/api/resources/${id}` : '/api/resources';
        const method = id ? 'PUT' : 'POST';
        const json = await api(method, url, body);
        if (json.success) {
            showToast(json.message, 'success');
            closeModal('resModal');
            loadResources();
        } else {
            showToast(json.message || 'İşlem başarısız', 'error');
        }
    }

    loadResources();
</script>
</body>
</html>
