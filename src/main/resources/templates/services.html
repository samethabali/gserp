<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>GSCRM — Hizmetler</title>
    <link th:replace="~{fragments/assets :: styles}"/>
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">💅</div>
            <div><h1>GSCRM</h1><span class="brand-sub">Salon Yönetim Sistemi</span></div>
        </div>
        <nav th:replace="~{fragments/sidebar-nav :: nav('services')}"></nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" id="menuToggle" aria-label="Menüyü Aç">☰</button>
                <span class="topbar-title">💇 Hizmet Yönetimi</span>
            </div>
            <div class="topbar-actions">
                <span style="color:var(--color-text-muted);font-size:0.9rem;">👤 <span sec:authentication="name">user</span></span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary btn-xs">Çıkış</button>
                </form>
            </div>
        </header>
        <div class="page-content">
            <div class="crud-header">
                <h2>Hizmet Tanımları</h2>
                <button class="btn btn-primary" onclick="openServiceModal()">➕ Yeni Hizmet</button>
            </div>
            <div class="glass-card" style="padding:0;overflow:hidden;">
                <table class="data-table">
                    <thead>
                        <tr><th>Hizmet Adı</th><th>Kategori</th><th>Süre</th><th>Fiyat</th><th>Kaynak</th><th>Durum</th><th>İşlem</th></tr>
                    </thead>
                    <tbody id="serviceTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<div class="modal-overlay" id="serviceModal">
    <div class="modal">
        <div class="modal-header">
            <h3 id="serviceModalTitle">Yeni Hizmet</h3>
            <button class="modal-close" onclick="closeModal('serviceModal')">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editServiceId">
            <div class="form-group">
                <label class="form-label">Hizmet Adı</label>
                <input type="text" class="form-input" id="svcName" required>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Kategori</label>
                    <select class="form-select" id="svcCategory">
                        <option value="HAIR">Saç</option>
                        <option value="NAIL">Tırnak</option>
                        <option value="SKIN">Cilt</option>
                        <option value="LASER">Lazer</option>
                        <option value="OTHER">Diğer</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Süre (dk)</label>
                    <input type="number" class="form-input" id="svcDuration" required>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Fiyat (₺)</label>
                <input type="number" class="form-input" id="svcPrice" step="0.01" required>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('serviceModal')">İptal</button>
            <button class="btn btn-primary" onclick="saveService()">💾 Kaydet</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script th:replace="~{fragments/assets :: app-js}"></script>
<script th:replace="~{fragments/assets :: custom-select-js}"></script>
<script>
    let services = [];
    const categoryLabels = { HAIR: '💇 Saç', NAIL: '💅 Tırnak', SKIN: '🧴 Cilt', LASER: '⚡ Lazer', OTHER: '📦 Diğer' };

    async function loadServices() {
        const json = await api('GET', '/api/services');
        services = json.data || [];
        renderServices();
    }

    function renderServices() {
        const tbody = document.getElementById('serviceTableBody');
        tbody.innerHTML = services.map(s => `
            <tr>
                <td><strong>${s.name}</strong></td>
                <td>${categoryLabels[s.category] || s.category}</td>
                <td>${s.durationMinutes} dk</td>
                <td><strong>${Number(s.basePrice).toLocaleString('tr-TR')} ₺</strong></td>
                <td>${s.requiresResource ? '🔒 Gerekli' : '—'}</td>
                <td><span class="badge ${s.active ? 'badge-completed' : 'badge-cancelled'}">${s.active ? 'Aktif' : 'Pasif'}</span></td>
                <td><button class="btn btn-xs btn-secondary" onclick="editService(${s.id})">✏️</button></td>
            </tr>
        `).join('');
    }

    function openServiceModal(s) {
        document.getElementById('editServiceId').value = s ? s.id : '';
        document.getElementById('svcName').value = s ? s.name : '';
        document.getElementById('svcCategory').value = s ? s.category : 'HAIR';
        document.getElementById('svcDuration').value = s ? s.durationMinutes : '';
        document.getElementById('svcPrice').value = s ? s.basePrice : '';
        document.getElementById('serviceModalTitle').textContent = s ? 'Hizmet Düzenle' : 'Yeni Hizmet';
        openModal('serviceModal');
    }

    function editService(id) {
        const s = services.find(x => x.id === id);
        if (s) openServiceModal(s);
    }

    async function saveService() {
        const id = document.getElementById('editServiceId').value;
        const body = {
            name: document.getElementById('svcName').value,
            category: document.getElementById('svcCategory').value,
            durationMinutes: parseInt(document.getElementById('svcDuration').value),
            basePrice: parseFloat(document.getElementById('svcPrice').value),
            active: true
        };
        const url = id ? `/api/services/${id}` : '/api/services';
        const method = id ? 'PUT' : 'POST';
        const json = await api(method, url, body);
        if (json.success) {
            showToast(json.message, 'success');
            closeModal('serviceModal');
            loadServices();
        } else {
            showToast(json.message || 'İşlem başarısız', 'error');
        }
    }

    loadServices();
</script>
</body>
</html>
