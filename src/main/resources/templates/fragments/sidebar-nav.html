<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav(active)" class="sidebar-nav">
    <!-- Kurulum bitene kadar sihirbaza dönüş yolu. Sihirbaz yalnızca girişten
         sonra açılıyordu; oradan ayrılan kullanıcı kuruluma bir daha ulaşamıyordu. -->
    <a href="/onboarding/setup" class="nav-item nav-item-setup"
       th:if="${onboardingIncomplete != null and onboardingIncomplete and !showcase}"
       sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','ORG_OWNER','PLATFORM_ADMIN')"
       th:classappend="${active == 'onboarding'} ? ' active' : ''"><span class="nav-icon">🚀</span> Kurulumu Tamamla</a>
    <span class="nav-section-title">Ana Menü</span>
    <a href="/" class="nav-item" th:classappend="${active == 'calendar'} ? ' active' : ''"><span class="nav-icon">📅</span> Takvim</a>
    <a href="/dashboard" class="nav-item" th:classappend="${active == 'dashboard'} ? ' active' : ''"><span class="nav-icon">📊</span> Dashboard</a>
    <span class="nav-section-title" sec:authorize="hasAnyRole('ORG_OWNER','PLATFORM_ADMIN')" th:unless="${showcase}">Organizasyon</span>
    <a href="/org/dashboard" class="nav-item" sec:authorize="hasAnyRole('ORG_OWNER','PLATFORM_ADMIN')" th:unless="${showcase}" th:classappend="${active == 'org'} ? ' active' : ''"><span class="nav-icon">🏢</span> Org Özeti</a>
    <span class="nav-section-title" sec:authorize="hasRole('PLATFORM_ADMIN')" th:unless="${showcase}">Platform</span>
    <a href="/platform/tenants" class="nav-item" sec:authorize="hasRole('PLATFORM_ADMIN')" th:unless="${showcase}" th:classappend="${active == 'platform'} ? ' active' : ''"><span class="nav-icon">🌐</span> Tenants</a>
    <span class="nav-section-title">Yönetim</span>
    <a href="/services" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','RECEPTIONIST')" th:classappend="${active == 'services'} ? ' active' : ''"><span class="nav-icon">💇</span> Hizmetler</a>
    <a href="/staff" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','RECEPTIONIST')" th:classappend="${active == 'staff'} ? ' active' : ''"><span class="nav-icon">👩‍💼</span> Personel</a>
    <a href="/resources" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','RECEPTIONIST')" th:unless="${showcase}" th:classappend="${active == 'resources'} ? ' active' : ''"><span class="nav-icon">🏠</span> Kaynaklar</a>
    <a href="/expenses" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','RECEPTIONIST')" th:unless="${showcase}" th:classappend="${active == 'expenses'} ? ' active' : ''"><span class="nav-icon">💸</span> Masraflar</a>
    <a href="/products" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','RECEPTIONIST')" th:unless="${showcase}" th:classappend="${active == 'products'} ? ' active' : ''"><span class="nav-icon">📦</span> Ürünler</a>
    <a href="/customers" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','RECEPTIONIST')" th:classappend="${active == 'customers'} ? ' active' : ''"><span class="nav-icon">👥</span> Müşteriler</a>
    <a href="/campaigns" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','RECEPTIONIST')" th:unless="${showcase}" th:classappend="${active == 'campaigns'} ? ' active' : ''"><span class="nav-icon">🎁</span> Kampanyalar</a>
    <span class="nav-section-title" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER')" th:unless="${showcase}">Yönetim Paneli</span>
    <a href="/settings" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER')" th:unless="${showcase}" th:classappend="${active == 'settings'} ? ' active' : ''"><span class="nav-icon">⚙️</span> Salon Ayarları</a>
    <a href="/settings/billing" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','ORG_OWNER')" th:unless="${showcase}" th:classappend="${active == 'billing'} ? ' active' : ''"><span class="nav-icon">💳</span> Abonelik</a>
    <span class="nav-section-title" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','RECEPTIONIST')">Sistem</span>
    <!-- Kanonik adres /{slug}. Sabit "/booking" yalnızca oturumdaki kiracıyla
         çözülüyor: yeni sekmede açılan adres paylaşılamaz ve oturumsuz açıldığında
         "işletme seçilmedi" hatası veriyordu. -->
    <a th:href="${bookingPath}" href="/booking" class="nav-item" target="_blank" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER','RECEPTIONIST')"><span class="nav-icon">🔗</span> Booking Sayfası</a>
    <a href="/audit" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER')" th:unless="${showcase}" th:classappend="${active == 'audit'} ? ' active' : ''"><span class="nav-icon">📋</span> İşlem Kütüğü</a>
    <a href="/users" class="nav-item" sec:authorize="hasAnyRole('ADMIN','BRANCH_MANAGER')" th:unless="${showcase}" th:classappend="${active == 'users'} ? ' active' : ''"><span class="nav-icon">🔐</span> Kullanıcılar</a>
    <div id="salonSwitcherWrap" class="salon-switcher-wrap" sec:authorize="hasAnyRole('ORG_OWNER','PLATFORM_ADMIN')" style="display:none;">
        <span class="nav-section-title">Şube</span>
        <select id="salonSwitcher" class="form-input salon-switcher-select" aria-label="Aktif şube"></select>
    </div>
</nav>
</body>
</html>
