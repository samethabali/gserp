<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- GSCRM ortak statik asset'ler — cache bust için app.asset-version kullanılır -->
<th:block th:fragment="styles">
    <meta name="robots" content="noindex, nofollow" th:if="${showcase}">
    <link rel="stylesheet"
          th:href="@{/css/style.css(v=${@environment.getProperty('app.asset-version', '1')})}">
    <style>
        select.custom-select-native { display: none !important; }
    </style>
</th:block>

<script th:fragment="app-js"
        th:src="@{/js/app.js(v=${@environment.getProperty('app.asset-version', '1')})}"></script>

<script th:fragment="custom-select-js"
        th:src="@{/js/custom-select.js(v=${@environment.getProperty('app.asset-version', '1')})}"></script>
</body>
</html>
