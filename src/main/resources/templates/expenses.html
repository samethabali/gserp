<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <title>GSERP — Masraflar</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="sidebar-overlay" id="sidebarOverlay"></div>
<div class="app-layout">
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">💅</div>
            <div><h1>GSERP</h1><span class="brand-sub">Salon Yönetim Sistemi</span></div>
        </div>
        <nav class="sidebar-nav">
            <span class="nav-section-title">Ana Menü</span>
            <a href="/" class="nav-item"><span class="nav-icon">📅</span> Takvim</a>
            <a href="/dashboard" class="nav-item"><span class="nav-icon">📊</span> Dashboard</a>
            <span class="nav-section-title">Yönetim</span>
            <a href="/services" class="nav-item"><span class="nav-icon">💇</span> Hizmetler</a>
            <a href="/staff" class="nav-item"><span class="nav-icon">👩‍💼</span> Personel</a>
            <a href="/resources" class="nav-item"><span class="nav-icon">🏠</span> Kaynaklar</a>
            <a href="/expenses" class="nav-item active"><span class="nav-icon">💸</span> Masraflar</a>
            <a href="/products" class="nav-item"><span class="nav-icon">📦</span> Ürünler</a>
            <a href="/customers" class="nav-item"><span class="nav-icon">👥</span> Müşteriler</a>
            <span class="nav-section-title">Sistem</span>
            <a href="/booking" class="nav-item" target="_blank"><span class="nav-icon">🔗</span> Booking Sayfası</a>
            <a href="/audit" class="nav-item"><span class="nav-icon">📋</span> İşlem Kütüğü</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="menu-toggle" id="menuToggle" aria-label="Menüyü Aç">☰</button>
                <span class="topbar-title">💸 Masraflar</span>
            </div>
            <div class="topbar-actions">
                <input type="date" id="dateFrom" class="form-input" style="width:140px;">
                <input type="date" id="dateTo" class="form-input" style="width:140px;">
                <button class="btn btn-secondary" onclick="loadExpenses()">🔍 Filtrele</button>
                <button class="btn btn-primary" onclick="openExpenseModal()">➕ Yeni Gider</button>
                <span style="color:var(--text-secondary);font-size:0.9rem;">👤 <span sec:authentication="name">user</span></span>
                <form method="post" th:action="@{/logout}" style="display:inline;">
                    <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-secondary btn-xs">Çıkış</button>
                </form>
            </div>
        </header>

        <div class="page-content">
            <!-- Özet kartları -->
            <div class="kpi-grid" id="expenseSummary" style="margin-bottom:20px;"></div>

            <!-- Gider listesi -->
            <div class="glass-card" style="padding:0;overflow:hidden;">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Tarih</th><th>Açıklama</th><th>Kategori</th>
                            <th>Tutar</th><th>Notlar</th><th>İşlem</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody">
                        <tr><td colspan="6" style="text-align:center;padding:40px;color:var(--text-muted);">Yükleniyor...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- Gider Modalı -->
<div class="modal-overlay" id="expenseModal">
    <div class="modal" style="max-width:460px;">
        <div class="modal-header">
            <h3 id="expenseModalTitle">Yeni Gider</h3>
            <button class="modal-close" onclick="closeModal('expenseModal')">✕</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="editExpenseId">
            <div class="form-group">
                <label class="form-label">Açıklama *</label>
                <input type="text" class="form-input" id="expDesc" placeholder="Kira, elektrik, malzeme...">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Tutar (₺) *</label>
                    <input type="number" class="form-input" id="expAmount" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label class="form-label">Tarih *</label>
                    <input type="date" class="form-input" id="expDate">
                </div>
            </div>
            <div class="form-group">
                <label class="form-label">Kategori</label>
                <select class="form-select" id="expCategory">
                    <option value="RENT">Kira</option>
                    <option value="UTILITIES">Faturalar (Su/Elektrik/Gaz)</option>
                    <option value="SUPPLIES">Malzeme/Sarf</option>
                    <option value="SALARY">Maaş/Ödemeler</option>
                    <option value="MAINTENANCE">Bakım/Onarım</option>
                    <option value="OTHER">Diğer</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Notlar</label>
                <textarea class="form-textarea" id="expNotes"></textarea>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="closeModal('expenseModal')">İptal</button>
            <button class="btn btn-primary" onclick="saveExpense()">💾 Kaydet</button>
        </div>
    </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/app.js"></script>
<script src="/js/expenses.js"></script>
</body>
</html>
