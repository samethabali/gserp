server:
  port: ${SERVER_PORT:8989}
  forward-headers-strategy: framework

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    deserialization:
      ADJUST_DATES_TO_CONTEXT_TIME_ZONE: false
      FAIL_ON_UNKNOWN_PROPERTIES: false
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  # Derleme zamanindan gelir (pom.xml -> build.timestamp, Maven suzmesi).
  # Elle guncellenen bir surum numarasi, tarayici onbellegi acikken
  # unutuldugunda kullanicilarda eski JS birakirdi.
  asset-version: "@build.timestamp@"
  # Boş bırakılırsa adres isteğin kendisinden türetilir (forward-headers-strategy
  # açık olduğu için vekil arkasında da doğru). Varsayılan "http://localhost:8989"
  # idi ve env geçilmediğinde salon sahibine randevu linki olarak localhost
  # gösteriliyordu.
  public-base-url: ${APP_PUBLIC_BASE_URL:}
  default-trial-days: 14
  jwt:
    # Base64-encoded en az 256-bit secret. Prod'da ${JWT_SECRET} ile geçersiz kılınmalı.
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1kZXYtb25seS1zZWNyZXQtY2hhbmdlLW1l}
    access-ttl-minutes: 60
    refresh-ttl-days: 7
  encryption:
    # At-rest sır şifreleme anahtarı. JWT secret'tan BAĞIMSIZ olmalı; boşsa JWT
    # secret'a düşer (uyarı loglanır). Prod'da APP_ENCRYPTION_KEY ile tanımlayın.
    key: ${APP_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8989}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: gscrm
  prometheus:
    metrics:
      export:
        enabled: true
