spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
    prometheus:
      enabled: true
  metrics:
    tags:
      application: gserp
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Logging seviyeleri logback-spring.xml'de profile bazlı tanımlı.
# Dosya yolu LOG_DIR env'iyle override edilebilir (default: /var/log/gserp).
