spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gserp_dev}
    username: ${SPRING_DATASOURCE_USERNAME:gserp}
    password: ${SPRING_DATASOURCE_PASSWORD:gserp}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate.format_sql: true
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# Logging seviyeleri logback-spring.xml'de profile bazlı tanımlı.

# Dev kolaylığı için ilk admin (InitialAdminSeeder DB boşsa yaratır).
# Prod'da BU DEĞERLER KULLANILMAZ — orada .env üzerinden geçer.
GSERP_INITIAL_ADMIN_USERNAME: admin
GSERP_INITIAL_ADMIN_PASSWORD: admin
